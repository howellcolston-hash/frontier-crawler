# Runs the crawler against the store named by the repository's secrets: a crawl four times a day
# for 85 minutes, scanned PDFs read once a day, the derived clients once a day, or any of them by hand. Nothing here runs for pull
# requests. The log carries counts only.
name: crawl
run-name: "crawl ${{ inputs.command || 'crawl' }}"
on:
  # started by the clock (clock.yml, tools/clock.py): crawls at 00:17, 06:17, 12:17 and 18:17 UTC, ocr 03:47, derived 09:47
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [crawl, judge, ocr, derived]
        default: crawl
      max_minutes:
        description: "crawl only: stop taking new URLs after this many minutes"
        default: "85"
permissions:
  contents: read
concurrency:
  group: crawl   # one run at a time: runs share the crawl state in the store
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CRAWLER_HF_REPO: ${{ secrets.HF_REPO }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      CRAWLER_JEV_MONTHLY_USD: "20"   # PROVISIONAL: monthly ceiling for the judge, accrued through the month
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      # Raw bodies on Google Drive (frontier_crawler/storage/cold.py), only when the Drive token secret exists: rclone reads the
      # remote horizon_drive from these variables. Without the secret, rclone is not installed and bodies go to the store.
      RCLONE_CONFIG_HORIZON_DRIVE_TYPE: drive
      RCLONE_CONFIG_HORIZON_DRIVE_SCOPE: drive.file
      RCLONE_CONFIG_HORIZON_DRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_HORIZON_DRIVE_TOKEN }}
      CRAWLER_RAW_REMOTE: ${{ secrets.RCLONE_CONFIG_HORIZON_DRIVE_TOKEN != '' && 'horizon_drive:horizon-raw' || '' }}
      COMMAND: ${{ inputs.command || 'crawl' }}
      MAX_MINUTES: ${{ inputs.max_minutes || '85' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install rclone
        if: ${{ env.RCLONE_CONFIG_HORIZON_DRIVE_TOKEN != '' }}
        run: |
          # Pinned and checked: v1.76.0, its SHA-256 from downloads.rclone.org/v1.76.0/SHA256SUMS.
          curl -fsSL -o "$RUNNER_TEMP/rclone.zip" https://downloads.rclone.org/v1.76.0/rclone-v1.76.0-linux-amd64.zip
          echo "b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7  $RUNNER_TEMP/rclone.zip" | sha256sum -c --quiet
          unzip -q -j "$RUNNER_TEMP/rclone.zip" '*/rclone' -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install the browser
        if: ${{ env.COMMAND == 'crawl' }}
        run: |
          # The headless shell alone; the full system packages only if it won't start.
          python -m playwright install --only-shell chromium
          python -c "from playwright.sync_api import sync_playwright as p; b = p().start().chromium.launch(); b.close()" \
            || python -m playwright install-deps chromium
      - name: Install Tesseract
        if: ${{ env.COMMAND == 'ocr' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-osd tesseract-ocr-fra tesseract-ocr-spa tesseract-ocr-por tesseract-ocr-ind tesseract-ocr-ara tesseract-ocr-rus tesseract-ocr-chi-sim
      - name: Run
        run: |
          # Without the store the tables would be written to the runner and lost.
          [ -n "$HF_TOKEN" ] && [ -n "$CRAWLER_HF_REPO" ] || { echo "error: the HF_TOKEN and HF_REPO secrets are required" >&2; exit 2; }
          if [ "$COMMAND" = "crawl" ]; then
            case "$MAX_MINUTES" in ''|*[!0-9.]*) echo "error: max_minutes must be a number" >&2; exit 2;; esac
            # PROVISIONAL. The pace is set by the storage and judging budgets, so a run stops when it has its pages and may finish well inside its minutes.
            python -m frontier_crawler crawl --max-fetches 8000 --max-minutes "$MAX_MINUTES"
          elif [ "$COMMAND" = "ocr" ]; then
            # Yesterday and today: each day's pages are downloaded whole to find its scans.
            python -m frontier_crawler ocr --start "$(date -u -d yesterday +%F)" --max-minutes 85
          else
            python -m frontier_crawler "$COMMAND"
          fi
