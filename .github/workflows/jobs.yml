# Runs jobs from a private repository on this repository's runners, when the clock (clock.yml) or a person or session dispatches them. Each run checks the
# private repository out and runs one of its own scripts there. The log shows step results only: every command's
# output goes to a file on the runner that is neither printed nor uploaded. Nothing here runs for pull requests.
name: jobs
# the title is public: it names the command only for the clock's three, never free text (a module's arguments)
run-name: "jobs ${{ inputs.job }} ${{ (inputs.command == 'daily' || inputs.command == 'digest' || inputs.command == 'sync') && inputs.command || '' }}"
on:
  # the daily runs are started by the clock (clock.yml, tools/clock.py), which dispatches them on time
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [collection, engine-sync, scout, demand, collect-daily, raw-checks, local, graph, module, long]   # graph, module: by hand only
        default: collection
      command:
        description: "the job's command (empty: its default)"
        default: ""
      dry_run:
        type: boolean
        default: true
      source:
        default: ""
      maps:
        default: ""
      max:
        default: "10"
      budget:
        description: "long: seconds (empty: its default)"
        default: ""
permissions:
  contents: read
concurrency:
  # one run at a time: runs write the same private branch. Model jobs (graph; distil bakeoff, drift, export, textfix, score,
  # evaluate) write only their own files, so they queue in a lane of their own and long ones do not hold the daily chain
  # long writes only its own files too and has a lane of its own; by-hand tender collector runs (backfills of long-lane
  # publishers) join it, since both rewrite tenders_ocds/long/state.json
  group: ${{ ((inputs.job == 'long' || (inputs.job == 'module' && startsWith(inputs.command, 'collectors.tenders_ocds'))) && 'jobs-long') || (inputs.job == 'graph' || (inputs.job == 'module' && (startsWith(inputs.command, 'distil bakeoff') || startsWith(inputs.command, 'distil drift')
    || startsWith(inputs.command, 'distil export') || startsWith(inputs.command, 'distil textfix') || startsWith(inputs.command, 'distil score')
    || startsWith(inputs.command, 'distil evaluate')))) && 'jobs-models' || 'jobs' }}
  cancel-in-progress: false
  queue: max
env:
  JOB: ${{ inputs.job }}
jobs:
  collect:
    if: ${{ inputs.job == 'collect-daily' }}
    strategy:
      fail-fast: false
      max-parallel: 1   # one collector at a time: each pushes the data branch, and the concurrency group does not serialize jobs within a run
      matrix:
        i: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps: &steps
      - name: Check out
        env:
          TOKEN: ${{ secrets.HORIZON_DATA_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/howellcolston-hash/horizon-data.git"
          git clone -q --depth 1 "$url" hd >/dev/null 2>&1
          git clone -q --depth 1 --branch data "$url" hd/data >/dev/null 2>&1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        id: run
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          INDEX: ${{ matrix.i }}
        working-directory: hd
        run: bash scripts/bridge.sh "$JOB" $INDEX >"$RUNNER_TEMP/out.log" 2>&1
      - name: Keep the log privately
        if: always()
        env:
          TOKEN: ${{ secrets.HORIZON_DATA_TOKEN }}
          INDEX: ${{ matrix.i }}
          OUTCOME: ${{ steps.run.outcome }}
        working-directory: hd
        run: bash scripts/bridge_log.sh "$RUNNER_TEMP/out.log" 2>/dev/null || true   # prints only the HTTP status

  run:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps: *steps
