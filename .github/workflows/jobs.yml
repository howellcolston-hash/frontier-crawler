# Runs jobs from a private repository on this repository's runners, by schedule or by hand. Each run checks the
# private repository out and runs one of its own scripts there. The log shows step results only: every command's
# output goes to a file on the runner that is neither printed nor uploaded. Nothing here runs for pull requests.
name: jobs
run-name: "jobs ${{ inputs.job || 'scheduled' }}"
on:
  schedule:
    - cron: "23 19 * * *"   # engine-sync with the digest, and collection: the morning pair, set the evening before
    - cron: "51 19 * * *"   # because GitHub starts these scheduled runs hours late
    - cron: "17 10 * * *"   # collect-daily, then demand
    - cron: "47 11 * * *"   # scout
    - cron: "41 13 * * *"   # raw-checks
    - cron: "23 16 * * *"   # engine-sync
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [collection, engine-sync, scout, demand, collect-daily, raw-checks, local, graph, module]   # graph, module: by hand only
        default: collection
      command:
        description: "the job's command (empty: its default)"
        default: ""
      dry_run:
        type: boolean
        default: true
      source:
        default: ""
      maps:
        default: ""
      max:
        default: "10"
permissions:
  contents: read
concurrency:
  # one run at a time: runs write the same private branch. Model jobs (graph; distil bakeoff, drift, export, textfix, score,
  # evaluate) write only their own files, so they queue in a lane of their own and long ones do not hold the daily chain
  group: ${{ (inputs.job == 'graph' || (inputs.job == 'module' && (startsWith(inputs.command, 'distil bakeoff') || startsWith(inputs.command, 'distil drift')
    || startsWith(inputs.command, 'distil export') || startsWith(inputs.command, 'distil textfix') || startsWith(inputs.command, 'distil score')
    || startsWith(inputs.command, 'distil evaluate')))) && 'jobs-models' || 'jobs' }}
  cancel-in-progress: false
  queue: max
env:
  JOB: ${{ inputs.job || (github.event.schedule == '51 19 * * *' && 'collection') || (github.event.schedule == '17 10 * * *' && 'collect-daily') || (github.event.schedule == '47 11 * * *' && 'scout') || (github.event.schedule == '41 13 * * *' && 'raw-checks') || 'engine-sync' }}
jobs:
  collect:
    if: ${{ inputs.job == 'collect-daily' || github.event.schedule == '17 10 * * *' }}
    strategy:
      fail-fast: false
      max-parallel: 1   # one collector at a time: each pushes the data branch, and the concurrency group does not serialize jobs within a run
      matrix:
        i: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps: &steps
      - name: Check out
        env:
          TOKEN: ${{ secrets.HORIZON_DATA_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/howellcolston-hash/horizon-data.git"
          git clone -q --depth 1 "$url" hd >/dev/null 2>&1
          git clone -q --depth 1 --branch data "$url" hd/data >/dev/null 2>&1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        id: run
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          INDEX: ${{ matrix.i }}
        working-directory: hd
        run: bash scripts/bridge.sh "$JOB" $INDEX >"$RUNNER_TEMP/out.log" 2>&1
      - name: Keep the log privately
        if: always()
        env:
          TOKEN: ${{ secrets.HORIZON_DATA_TOKEN }}
          INDEX: ${{ matrix.i }}
          OUTCOME: ${{ steps.run.outcome }}
        working-directory: hd
        run: bash scripts/bridge_log.sh "$RUNNER_TEMP/out.log" 2>/dev/null || true   # prints only the HTTP status

  run:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps: *steps
